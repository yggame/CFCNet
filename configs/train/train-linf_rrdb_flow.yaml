train_dataset:
  dataset:
    name: image-folder
    args:
      root_path: J://data_path/sr_datasets/Screen_Content_Image_Super-Resolution/Data/SCI1K-Train/HR
      repeat: 20
      cache: in_memory
  wrapper:
    name: sr-implicit-downsampled-fast
    args:
      inp_size: 48
      scale_max: 4
      scale_min: 1
      augment: True

  batch_size: 16

val_dataset:
  dataset:
    name: image-folder
    args:
      root_path: J://data_path/sr_datasets/Screen_Content_Image_Super-Resolution/Data/SCI1K-Test/X2/HR
      first_k: 10
      repeat: 16
      cache: in_memory
  wrapper:
    name: sr-implicit-downsampled-fast
    args:
      inp_size: 48
      scale_max: 4
      scale_min: 1
      # sample_q: 2304
      # cell_decode: True
  batch_size: 16

data_norm:
  inp: {sub: [0.5], div: [0.5]}
  gt: {sub: [0.5], div: [0.5]}

model:
  name: linf
  args:
    encoder_spec:
      name: rrdb
      args:
        no_upsampling: true
    imnet_spec:
      name: flow
      args:
        name: flow
    flow_layers: 10
    num_layer: 3
    hidden_dim: 256

optimizer:
  name: adam
  args:
    lr: 1.e-4
epoch_max: 1000

# update each loss separately
sep: false

multi_step_lr:
  milestones: [200, 400, 600, 800]
  gamma: 0.5

loss_weight:
  nll: !!float 1
  pixel: !!float 0
  vgg: !!float 0

epoch_val: 1
epoch_save: 100
eval_bsize: 16

resume: ./save/rdn+btc-3rd/epoch_last.pth
pre_train: ~