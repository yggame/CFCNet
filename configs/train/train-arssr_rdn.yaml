train_dataset:
  dataset:
    name: image-folder
    args:
      root_path: J://data_path/sr_datasets/Screen_Content_Image_Super-Resolution/Data/SCI1K-Train/HR
      repeat: 1
      cache: in_memory
  wrapper:
    name: sr-implicit-downsampled
    args:
      inp_size: 48
      scale_max: 4
      scale_min: 1
      augment: True
      sample_q: 2304 
      cell_decode: True
  batch_size: 2

val_dataset:
  dataset:
    name: image-folder
    args:
      root_path: J://data_path/sr_datasets/Screen_Content_Image_Super-Resolution/Data/SCI1K-Test/X2/HR
      first_k: 10
      repeat: 1
      cache: in_memory
  wrapper:
    name: sr-implicit-downsampled
    args:
      inp_size: 48
      scale_max: 4
      scale_min: 1
      sample_q: 2304
      cell_decode: True
  batch_size: 2

data_norm:
  inp: {sub: [0.5], div: [0.5]}
  gt: {sub: [0.5], div: [0.5]}

model:
  name: arssr
  args:
    encoder_name: RDN
    feature_dim: 128
    decoder_depth: 4
    decoder_width: 256

optimizer:
  name: adam
  args:
    lr: 1.e-4
epoch_max: 1000
multi_step_lr:
  milestones: [200, 400, 600, 800]
  gamma: 0.5

epoch_val: 1
epoch_save: 100
eval_bsize: 16

resume: ~
pre_train: ~